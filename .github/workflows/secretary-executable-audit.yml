name: Secretary Executable Audit Safeguard

on:
  pull_request:
  push:
    branches: [main]

jobs:
  secretary-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install pyyaml jsonschema pytest
      - name: Compile Secretary and predecessor runtimes
        run: python -m py_compile secretary_gate.py secretary_audit.py evidence_genealogy.py minister_ground_files.py genealogical_round.py sovereign_round.py
      - name: Run Secretary audit regressions
        run: python -m pytest -q tests/test_secretary_audit.py tests/test_secretary_gate.py
      - name: Re-run genealogy regressions
        run: python -m pytest -q tests/test_evidence_genealogy.py tests/test_minister_ground_files.py tests/test_genealogy_contract_history.py
      - name: Re-run adversarial predecessor regressions
        run: python -m pytest -q tests/test_minister_horus.py tests/test_adversarial_horus.py tests/test_adversarial_report_contract.py
