name: Federation CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Sanctum
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: Sanctum

      - name: Check out registered Custos release
        uses: actions/checkout@v4
        with:
          repository: izzy9118-blip/custos
          ref: 26a3f1a122c96ccf63d1b1744d43a9ecec3833dc
          fetch-depth: 0
          path: custos

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Sanctum/pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "jsonschema>=4.22,<5" \
            "PyYAML>=6.0,<7" \
            "pydantic>=2.7,<3" \
            "pytest>=8.2,<9"

      - name: Run unit and release-to-release tests
        working-directory: Sanctum
        env:
          CUSTOS_REPO_ROOT: ${{ github.workspace }}/custos
          RUN_CUSTOS_INTEGRATION: "1"
          PYTHONPATH: src
        run: python -m pytest
