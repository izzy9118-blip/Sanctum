name: Secretary Pre-Run Gate

# The gate is enforcement, so it is tested like enforcement: if the checklist can
# be skipped, if a stage can be taken out of order, or if the harness can be made
# to CALL without a pass token, this check fails and the merge stops.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secretary-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install validation dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Compile the gate and everything it gates
        run: python -m py_compile secretary_gate.py secretary_audit.py harness.py sovereign_round.py genealogical_round.py
      - name: Run the pre-run gate and post-run audit regressions
        run: python -m pytest -q tests/test_secretary_gate.py tests/test_secretary_audit.py
      - name: The charter, the contract, and the counterfeit registry must be on disk
        run: |
          test -f offices/secretary/charter.md
          test -f contracts/secretary-checklist.schema.json
          test -f registry/counterfeits.yaml
      - name: A one-shot dispatch must not be able to obtain a pass token
        run: |
          python - <<'PY'
          import sys
          import secretary_gate
          checklist = secretary_gate.one_shot_checklist(
              board="ci", board_type="polity", minister_id="ci", inquiry_id="ci-one-shot")
          try:
              secretary_gate.open_gate(checklist)
          except secretary_gate.SecretaryGateError as exc:
              print("REFUSED as required: %s" % exc)
              sys.exit(0)
          print("A one-shot reasoned dispatch obtained a pass token. The gate is not a gate.")
          sys.exit(1)
          PY
      - name: The harness must refuse to CALL without a pass token
        run: |
          python - <<'PY'
          import sys
          import harness
          import secretary_gate
          try:
              harness.call({"provider": "stub"}, "context")
          except secretary_gate.SecretaryGateError as exc:
              print("REFUSED as required: %s" % exc)
              sys.exit(0)
          print("The harness called without a Secretary pass token.")
          sys.exit(1)
          PY
