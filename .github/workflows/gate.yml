name: Sanctum Validation Gate

on:
  pull_request:
    paths:
      - 'inquiries/**'
      - 'schemas/**'
      - 'registry/**'
      - 'gate/**'
      - 'projection/**'
      - 'tests/**'
      - '*.schema.json'
      - 'assembly.py'
      - '.github/workflows/gate.yml'
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install pyyaml jsonschema pytest
      - name: Compile the constitutional runtime
        run: python -m py_compile assembly.py gate/gate.py projection/projection.py
      - name: Run the Assembly articulation harness
        run: python assembly.py
      - name: Run registry and federation artifact tests
        run: python -m pytest -q
      - name: Validate committed inquiry candidates through the constitutional gate
        run: |
          set -e
          status=0
          for d in inquiries/*/ ; do
            [ -d "$d" ] || continue
            python3 gate/gate.py "$d" schemas registry || status=1
          done
          # A rejection anywhere fails the check and blocks the merge.
          # FLAGGED inquiries pass CI but retain their flags for the outside
          # ground to resolve before certification.
          exit $status
