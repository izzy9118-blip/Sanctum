name: Presidential Proposition Matrix Safeguard

on:
  pull_request:
  push:
    branches: [main]

jobs:
  proposition-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install validation dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Compile proposition-aware synthesis runtime
        run: python -m py_compile proposition_matrix.py presidential_synthesis.py
      - name: Parse matrix contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          json.loads(Path('contracts/proposition-matrix.schema.json').read_text(encoding='utf-8'))
          print('matrix contract parses')
          PY
      - name: Run proposition matrix regressions
        run: python -m pytest -q tests/test_proposition_matrix.py
      - name: Re-run predecessor safeguards
        run: python -m pytest -q tests/test_source_absence.py tests/test_minister_horus.py tests/test_adversarial_horus.py tests/test_secretary_audit.py
