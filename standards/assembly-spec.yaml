---
record_type: sanctum_assembly_spec
id: ASSEMBLY-SPEC-001
version: 1.5.0
status: PROPOSED_PENDING_OWNER_RATIFICATION
predecessor:
  path: standards/assembly-spec.v1.4.0.yaml
  version: 1.4.0
revision:
  date: 2026-08-08
  reason: >-
    Add an independent executable Secretary audit after proposition genealogy.
    The Secretary re-reads committed run artifacts and independently re-resolves
    their structural and provenance bindings before Sanctum may treat the reasoned
    run as Secretary-audited.

governs:
  - secretary_audit.py
  - genealogical_round.py
  - evidence_genealogy.py
  - minister_ground_files.py

principle: >-
  A minister cannot validate its own report merely by producing artifacts that say
  they are valid. After the ministerial reasoning and genealogy stages finish, a
  separate deterministic Secretary process must re-open the artifacts from disk,
  recompute their bindings, and fail closed on disagreement. The Secretary audits
  provenance and structure only; it never certifies truth, wisdom, or completeness.

inheritance:
  predecessor_spec: standards/assembly-spec.v1.4.0.yaml
  predecessor_runtime: genealogical_round.py
  v1_4_genealogy_preserved: true
  required_predecessor_steps:
    - investigative Horus exchange
    - provisional ministerial judgment
    - adversarial Horus exchange
    - revised non-authoritative draft
    - structured final proposition package
    - proposition-level genealogy validation
    - sovereign minister file resolution
    - rendered Ministerial Report

mandatory_postcondition:
  name: independent_secretary_audit
  actor: secretary
  runtime: secretary_audit.py
  required_for_mode: reasoned
  on_missing: HOLD_REASONED_RUN
  on_failure: HOLD_REASONED_RUN
  output: reports/<board>/<minister>-<date>.secretary-audit.json
  rule: >-
    A reasoned run produced under the forward contract is not Secretary-audited
    until secretary_audit.py independently returns PASS over the persisted artifacts.

secretary_checks:
  - governing Secretary spec identity
  - required artifact presence
  - inquiry and minister identity continuity
  - pinned minister repository commit continuity
  - canonical final-package hash binding
  - both Horus exchange request/response hash bindings
  - independent proposition genealogy re-resolution
  - sovereign minister repository file and identifier resolution
  - persisted genealogy artifact equality with independent re-resolution
  - no-self-certification markers

independence_law: >-
  The Secretary audit may consume ministerial and Horus artifacts but may not accept
  a model statement that those artifacts are valid as evidence of validity. It must
  recompute the checks deterministically from the persisted records.

failure_law: >-
  Any missing artifact, changed hash, identity mismatch, unresolved genealogy,
  sovereign-file failure, or forbidden certification marker causes a hard Secretary
  failure. The failed audit must not be represented as a successful Assembly run.

history_law: >-
  v1.5 is forward-only. The v1.4 genealogy specification is preserved at
  standards/assembly-spec.v1.4.0.yaml. Historical artifacts remain governed by the
  contracts under which they were produced.

laws_enforced:
  secretary_separation: >-
    THE SECRETARY SEPARATION LAW - the reasoning actor does not perform or declare
    the independent audit that admits its own output as structurally conforming.
  recomputation: >-
    THE RECOMPUTATION LAW - Secretary validation is based on recomputed hashes,
    identities, genealogy resolution, and file resolution, not copied PASS fields.
  fail_closed: >-
    THE SECRETARY FAIL-CLOSED LAW - an absent or failed Secretary audit leaves the
    forward reasoned run unaudited and held.
  no_self_certification: >-
    Secretary PASS means structural/provenance audit PASS only. It is never a truth,
    completeness, correctness, or wisdom certification.
