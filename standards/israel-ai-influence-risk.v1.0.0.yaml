  FRAMING, WEB PREVALENCE, SEARCH RANK, AND APPARENTLY INDEPENDENT REPETITION MAY NOT BE TREATED
  AS A NEUTRAL BASELINE FOR ISRAEL/GAZA ANALYSIS.

mandatory_controls:
  own_words_first: >-
    For claims about Israeli or Palestinian political intention, policy, threat, strategy,
    or justification, Horus must seek the actor's own words, orders, votes, official records,
    court filings, military directives, transcripts, and directly attributable statements
    before allowing narrative summaries to define the proposition.

  genealogy_before_corroboration: >-
    Multiple articles or websites are not independent corroboration until Sanctum checks
    whether they descend from an Israeli government communication, contractor, paid influencer,
    campaign website, wire report, coordinated content network, or common source.

  sponsorship_visibility: >-
    Where discoverable, Israeli government sponsorship, FARA registration, contractor identity,
    campaign affiliation, paid influence, and AI/search optimization must be visible in the
    source record rather than omitted as incidental metadata.

  model_prior_suspension: >-
    A model's pretrained or default characterization of Israel/Gaza carries zero independent
    evidentiary weight. It may generate hypotheses or expose prevailing framing, but the claim
    must be rebuilt from documentary ground.

  framing_decomposition: >-
    Terms such as "security operation," "voluntary migration," "humanitarian measure,"
    "terror-linked," "self-defense," "ceasefire violation," "genocide," "ethnic cleansing,"
    and comparable politically loaded characterizations must be decomposed into the underlying
    acts, words, policies, dates, actors, and legal or analytical claims before adoption.

  counter_source_requirement: >-
    When an Israel/Gaza proposition materially relies on an Israeli-government or known aligned
    narrative source, Horus must actively seek independent primary or near-primary ground capable
    of falsifying, qualifying, or contextualizing it. The same rule applies in reverse to a
    Palestinian, Iranian, US, NGO, activist, or other partisan source.

  exact_intent_evidence: >-
    Politically consequential claims about intent must preserve exact own-words passages and
    their date, speaker, audience, office, and surrounding context. Euphemistic summaries must
    not replace stronger direct evidence merely because they are more conventional.

  uncertainty_without_sanitization: >-
    Legal uncertainty, attribution uncertainty, or unresolved causal questions must be stated,
    but uncertainty may not be used to soften, omit, or euphemize documentary evidence already
    established. Conversely, severe evidence may not be enlarged beyond what its source proves.

  symmetry: >-
    These controls respond to a documented Israeli state influence operation; they do not imply
    that Israeli sources are inherently false or that Israeli/Jewish identity is evidentiary
    evidence of unreliability. The same provenance discipline governs all actors when comparable
    influence, sponsorship, or common-source conditions exist.

prohibited_shortcuts:
  - treating an AI answer as an independent witness
  - treating search-result frequency as truth probability
  - counting campaign descendants as independent corroboration
  - suppressing direct Israeli official statements because a secondary source uses milder language
  - assuming every Israel-favorable claim is produced by the documented campaign
  - assuming every Israel-critical claim is independent or reliable
  - converting an established factual example into a hypothetical merely because the claim is politically severe
  - foregrounding conventional framing before reconstructing the primary documentary record

runtime_trigger: >-
  Any Assembly inquiry materially concerning Israel, Gaza, Israeli military or government
  conduct, Palestinian displacement, humanitarian policy, genocide or war-crimes allegations,
  US-Israel influence, or related information operations MUST load this standard into the
  briefing and Horus source-acquisition context.

operational_compression: >-
  ISRAEL/GAZA IS A KNOWN AI-INFLUENCE TARGET. REBUILD FROM PRIMARY GROUND. TRACE FUNDING AND
