title: Israel-Specific AI Influence and Information-Environment Risk

issue_statement: >-
  Sanctum has documentary ground that the Government of Israel has financed a deliberate
  influence operation whose stated methods include creating websites and content intended
  to shape GPT framing and AI-system outputs about Israel, including Gaza-related narratives.
  Therefore the Israel/Gaza information environment is not treated as a neutral web sample.
  It is a KNOWN TARGET OF STATE-SPONSORED AI-FACING INFLUENCE. Search prominence, repeated
  framing, apparent source plurality, chatbot consensus, and model-default characterizations
  concerning Israel/Gaza may reflect an engineered information environment and may not be
  treated as independent corroboration without provenance and genealogy checks.

