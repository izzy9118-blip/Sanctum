---
record_type: sanctum_constitutional_environment_manifest_standard
id: CONSTITUTIONAL-ENVIRONMENT-001
version: 1.2.0
status: RATIFIED_BY_OWNER
ratification:
  date: 2026-08-24
  authority: REPOSITORY_OWNER_DIRECTIVE
  directive: "Do it"
  predecessor: standards/constitutional-environment-manifest.v1.1.0.yaml
date: 2026-08-24
purpose: >-
  Bind every forward Assembly inquiry to the exact constitutional and repository
  environment under which it was executed, including a Sanctum-owned immutable
  Horus pin, the exact acquisition runtime, each owner-certified minister corpus pin,
  and the separately pinned adapter overlay used to expose that sovereign repository
  to the universal harness.
required_bindings:
  sanctum:
    - repository_commit
    - assembly_spec_path
    - assembly_spec_sha256
    - registry_path
    - registry_version
    - registry_sha256
    - adapter_registry_path
    - adapter_registry_version
    - adapter_registry_sha256
    - final_judgment_contract_path
    - final_judgment_contract_sha256
    - proposition_matrix_standard_path
    - proposition_matrix_standard_sha256
    - ministerial_silence_standard_path
    - ministerial_silence_standard_sha256
    - source_absence_standard_path
    - source_absence_standard_sha256
  horus:
    - registry_path
    - registry_version
    - registry_sha256
    - repository
    - repository_commit
    - pinned_commit
    - manifest_path
    - manifest_sha256
    - response_contract_path
    - response_contract_sha256
    - acquisition_receipt_contract_path
    - acquisition_receipt_contract_sha256
    - principal_source_profile_contract_path
    - principal_source_profile_contract_sha256
    - canonical_runtime_path
    - canonical_runtime_sha256
    - acquisition_protocol
  ministers:
    - minister_id
    - repository
    - pinned_commit
    - certified_base_commit
    - runtime_overlay_commit
    - adapter_entrypoint
    - manifest_path
    - manifest_sha256
  runtime:
    - python_version
    - platform
    - manifest_builder_sha256
hard_rules:
  - Every established minister in the live registry must appear exactly once.
  - The owner-certified minister pin remains the sovereign corpus authority.
  - A runtime adapter overlay must descend from that certified pin and may alter only the adapter entrypoint explicitly allowed by registry/adapters.v1.yaml.
  - A minister checkout used by a forward harness run must match the exact runtime_overlay_commit; the manifest and all minister documentary files remain those of the certified base unless separately repinned by owner action.
  - Horus must be registered by Sanctum at an exact immutable commit before a forward reasoned inquiry may run.
  - The checked-out Horus repository must equal registry/horus.yaml pinned_commit; recording a floating checkout is insufficient.
  - The Horus response contract, acquisition receipt contract, principal source profile contract and canonical runtime are bound by path and SHA-256.
  - Production reasoned rounds invoke the canonical runtime from the pinned Horus checkout; arbitrary Horus commands are test-only overrides.
  - Every governing file is bound by path and SHA-256, not by version label alone.
  - The Sanctum commit is recorded from the checked-out repository and may not be replaced by a branch name.
  - A manifest with a missing required repository, file, hash, protocol, base pin, overlay pin, or overlay-diff mismatch fails closed.
  - Historical manifests are immutable records of the environment that actually governed that inquiry.
  - Manifest validation certifies identity and reproducibility only; it never certifies truth or completeness.
output:
  path: inquiries/<inquiry-id>/constitutional-environment.json
  certification: NONE_SELF_CERTIFICATION_PROHIBITED
