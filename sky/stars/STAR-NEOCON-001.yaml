star_id: STAR-NEOCON-001
name: American neoconservatism
status: FACT

fact: >-
  American neoconservatism is a distinct historical intellectual and political
  movement formed through the convergence of multiple independent and overlapping
  streams. No single thinker, school, person, institution, or lineage exhausts
  its origins or development.

spectrum:
  anti_stalinist_left:
    fact: >-
      One important stream arose from New York anti-Stalinist intellectual circles,
      including people with Shachtmanite and, in some cases, Trotskyist backgrounds,
      who moved toward increasingly militant anti-Communism and later neoconservative
      politics.
    people:
      - Max Shachtman
      - Irving Kristol
    boundary: >-
      This does not establish that all neoconservatives were Trotskyists or that
      neoconservatism is reducible to Trotskyism.

  straussian_line:
    fact: >-
      Leo Strauss and a line of students, readers, and intellectual descendants
      constitute one independent intellectual source connected to later American
      neoconservatism.
    people:
      - Leo Strauss
      - Straussian students and intellectual descendants
      - Paul Wolfowitz
    boundary: >-
      The historical connection does not establish that later neoconservatives
      understood Strauss correctly, that their political programs simply embodied
      Strauss's teaching, or that other neoconservative source streams derive from
      Strauss.

  wohlstetter_strategic_line:
    fact: >-
      Albert James Wohlstetter constitutes an independent strategic and defense-policy
      source feeding later neoconservative foreign-policy networks, especially through
      his influence on Paul Wolfowitz and Richard Perle.
    people:
      - Albert James Wohlstetter
      - Paul Wolfowitz
      - Richard Perle
    institutions:
      - RAND Corporation
    boundary: >-
      Wohlstetter is not a branch of Leo Strauss. The Wohlstetter and Straussian
      lines are independent even where they intersect through shared later figures.

  cold_war_liberal_line:
    fact: >-
      Neoconservative foreign policy also drew from the postwar liberal-hawk and
      Truman-era anti-Communist tradition: confidence in American power, strong
      military preparedness, opposition to Soviet expansion, and resistance to
      the Democratic Party's post-Vietnam antiwar turn.
    people:
      - Harry S. Truman
      - Henry M. "Scoop" Jackson
    boundary: >-
      This stream is broader than the Shachtmanite lineage and should not be
      collapsed into it.

  new_york_intellectual_world:
    fact: >-
      Neoconservatism first developed substantially as a New York intellectual
      movement before becoming a Washington policy network. Journals, editors,
      writers, and overlapping intellectual circles were major vehicles through
      which the movement formed and reproduced itself.
    people:
      - Irving Kristol
      - Norman Podhoretz
      - Nathan Glazer
      - Daniel Bell
    institutions:
      - Commentary
      - The Public Interest
    boundary: >-
      Participation in this intellectual world does not by itself establish a
      single shared ideology or identical later political commitments.

  scoop_jackson_network:
    fact: >-
      Senator Henry M. "Scoop" Jackson's Washington operation became a major
      political and institutional transmission point for policy-oriented
      neoconservatives in the late 1960s and 1970s.
    people:
      - Henry M. "Scoop" Jackson
      - Richard Perle
      - Paul Wolfowitz
      - Elliott Abrams
      - Frank Gaffney
      - Douglas Feith
      - William Kristol
    boundary: >-
      The Jackson network was a political convergence point, not the single
      intellectual origin of every person who passed through or around it.

  pro_israel_commitment:
    fact: >-
      Strong support for Israel became a major and persistent feature of
      neoconservative foreign policy and an important point of distinction from
      other American conservative and liberal foreign-policy traditions.
    boundary: >-
      This fact does not establish that every neoconservative held identical views
      about Israel or that support for Israel alone defines neoconservatism.

  defense_establishment:
    fact: >-
      Neoconservative policy networks developed substantial and recurring ties to
      the American defense and national-security establishment, including defense
      intellectuals, military-policy institutions, think tanks, government service,
      and defense-industry relationships.
    institutions:
      - RAND Corporation
      - American Enterprise Institute
      - Pentagon and national-security bureaucracy
      - defense-policy think tanks
    boundary: >-
      Institutional and financial ties do not by themselves establish that every
      neoconservative argument or policy position was caused by defense-industry
      interests.

  israel_defense_fusion_thesis:
    source_characterization: >-
      Andrew Cockburn, repeatedly in interviews with Scott Horton, characterizes
      the mature neoconservative movement as a political fusion of the pro-Israel
      lobby and the American defense lobby and identifies Paul Nitze as an important
      figure in bringing those interests together in the 1970s.
    status: ATTRIBUTED_SOURCE_CHARACTERIZATION
    people:
      - Andrew Cockburn
      - Paul Nitze
    boundary: >-
      The characterization is preserved because it is an important map supplied by
      Cockburn and repeatedly examined by Horton. It is not silently converted here
      into a stronger universal causal fact than the documentary ground establishes.

junction_people:
  Irving_Kristol:
    rule: MULTIPLE_INFLUENCES_ALLOWED
    connections:
      - Shachtmanite and Trotskyist background
      - New York anti-Stalinist intellectual world
      - magazine and publishing network
      - Cold War anti-Communism
      - formative neoconservative intellectual
    boundary: >-
      Kristol is not assigned to one exclusive lineage.

  Paul_Wolfowitz:
    rule: MULTIPLE_INFLUENCES_ALLOWED
    connections:
      - exposure to Leo Strauss at the University of Chicago
      - doctoral student of Albert James Wohlstetter
      - connection to the Scoop Jackson Washington network
      - later senior government and neoconservative foreign-policy role
    boundary: >-
      The Strauss and Wohlstetter connections remain independent facts; neither
      cancels nor subsumes the other.

  Richard_Perle:
    rule: MULTIPLE_INFLUENCES_ALLOWED
    connections:
      - mentored by Albert James Wohlstetter
      - brought into Washington through the Wohlstetter connection
      - senior foreign-policy aide to Scoop Jackson
      - later major neoconservative defense-policy figure
    boundary: >-
      Perle's position in several networks does not make those networks branches of
      one another.

  Norman_Podhoretz:
    rule: MULTIPLE_INFLUENCES_ALLOWED
    connections:
      - New York intellectual and magazine world
      - Commentary
      - militant Cold War anti-Communism
      - strong pro-Israel commitment
      - formative neoconservative intellectual

historical_transmission:
  - New York intellectual formation
  - anti-Stalinist and Cold War anti-Communist networks
  - independent Straussian intellectual lineage
  - independent Wohlstetter strategic lineage
  - Scoop Jackson Washington policy network
  - think tanks and journals
  - executive-branch and national-security service
  - Republican and Democratic hawkish political networks
  - later foreign-policy programs and interventions

mapping_rules:
  - A person may have multiple independent influences.
  - Distinct source streams may intersect without becoming branches of one another.
  - Connection is not the same as exclusive causation.
  - A later actor may inherit from several streams simultaneously.
  - A source characterization remains attributed when it exceeds the settled fact.
  - The movement may form a network; it must not be forced into a single family tree.

