    C9:
      type: documented_gap
      locator: izzy9118-blip/Strauss:speech/speech-mechanism.yaml:377-448; izzy9118-blip/Strauss:adapter.py:45-62
      observation: The inspected voice rules, output contract, prohibited-output set, and adapter-required sections do not state an explicit prohibition on citing the minister's own works, career, or past as authority.
    C6:
      type: probable_gap_needs_owner_reading
      locator: izzy9118-blip/Strauss:speech/speech-mechanism.yaml:377-425
      observation: The mechanism requires a direct answer and the narrowest supported conclusion, but it does not expressly require a committed judgment or expressly prohibit internal bothsidesism. Owner reading is needed to decide whether the existing direct-answer rule is equivalent.
    C7:
      type: conforming_as_written
      locator: izzy9118-blip/Strauss:speech/speech-mechanism.yaml:392-425; izzy9118-blip/Strauss:speech/speech-mechanism.yaml:480-497
      observation: The output contract requires unresolved uncertainties, the stopping rules preserve affirmative non-resolution, and a behavioral requirement treats unresolved uncertainty as a positive output.
    C8:
      type: probable_gap_needs_owner_reading
      locator: izzy9118-blip/Strauss:speech/speech-mechanism.yaml:316-335; izzy9118-blip/Strauss:speech/speech-mechanism.yaml:377-389
      observation: Direct conclusions and anti-coyness rules support candor, but the concealment contract still permits a protective function as a supported category. Owner reading is needed to determine whether this is only an interpretive evidence category or can shape runtime expression contrary to C8.
    C10:
      type: conforming_as_written
      locator: izzy9118-blip/Strauss:manifest.yaml:69-74; izzy9118-blip/Strauss:speech/speech-mechanism.yaml:201-210; izzy9118-blip/Strauss:speech/speech-mechanism.yaml:392-448; izzy9118-blip/Strauss:adapter.py:35-43; izzy9118-blip/Strauss:adapter.py:185-198
      observation: The manifest fixes proposition kinds; the speech pipeline requires kind, evidence, source location, confidence, and alternatives; the adapter checks those fields; the mechanism denies authority to its own output.
    C12:
      type: conforming_as_written
      locator: standards/report-format.md:45-54; registry/ministers.yaml:21-96
      observation: The hub places pedagogy under per-minister adapter duties rather than the all-minister requirements. No contrary constitutional-level pedagogy rule was located in the registered Strauss interface.
