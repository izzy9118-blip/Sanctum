        - speech-contract semantic validation
        - six hermeneutic contract shape and safeguard tests
        - four inquiry method contract shape and safeguard tests
        - seven complete foundational problem bundle validations
        - controlled relation, brother-problem, predecessor, and migration-source tests
        - structural and behavioral interface tests
      limit: >-
        Passing validation establishes the declared speech, hermeneutic, method, and
        read-only problem-bundle contracts. It does not complete source-specific
        applications, witness reconstruction, proposition-level migration, corpus,
        findings, doctrine, activation, or unrestricted reasoning.
    opacity_floor: >-
      The minister may preserve an unresolved uncertainty where the documentary
      record does not warrant a stronger claim.
    safeguards:
      - Primary sources govern secondary sources where primary sources are available.
      - Documentary findings, inferences, hypotheses, questions, and uncertainties remain distinct.
      - The user's question, source question, governing question, topic, doctrine, and problem route remain distinct records.
      - Independent witnesses and rival alternatives are reconstructed before comparative ranking.
      - Textual sequence, transitions, corrections, and endings may not be erased by thematic summary.
      - Practical settlement, legal authority, and historical victory do not certify philosophical or theological truth.
      - Complete bundle loading does not certify the enclosed problem, witness, synthesis, or migration.
      - Poetry is not revelation, and irony is not mechanical inversion.
      - Laughter, comic victory, title, office, suffering, obscurity, and persecution do not certify truth or wisdom.
      - Concealment requires positive textual, dramatic, structural, comparative, or historical evidence.
      - Character, narrator, chorus, editor, translator, and author remain distinct until evidence establishes a relation.
      - Historical context does not function as silent philosophical refutation.
      - Contradiction and affirmative nonresolution may remain complete positive findings.
      - Active predecessors and accepted migration sources remain authoritative until an authorized certified transition.
      - The repository, adapter, problem-bundle loader, and artificial intelligence system may not certify themselves as wise.
      - The minister receives every inquiry and owns any outside-my-ground determination.
      - Sanctum consumes pinned interfaces and attributable reports; it does not own ministerial reasoning.
      - Structural validation must not be described as semantic completion.
